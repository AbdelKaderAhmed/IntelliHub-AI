services:
  # 1. Relational Database System
  postgres_db:
    image: postgres:16-alpine
    container_name: intellihub_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-intellihub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - intellihub_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-intellihub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Vector Database System
  qdrant_db:
    image: qdrant/qdrant:v1.9.0
    container_name: intellihub_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - intellihub_network

  # 3. Object Storage System
  minio_storage:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: intellihub_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    volumes:
      - minio_data:/data
    networks:
      - intellihub_network
    command: server /data --console-address ":9001"

  # 4. FastAPI Enterprise Application Gateway (Backend)
  backend_api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: intellihub_backend
    restart: always
    depends_on:
      postgres_db:
        condition: service_healthy
      qdrant_db:
        condition: service_started
      minio_storage:
        condition: service_started
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../backend:/app
      - ../../storage:/app/storage
    env_file:
      - ../../backend/.env
    networks:
      - intellihub_network

networks:
  intellihub_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  minio_data:
    driver: local